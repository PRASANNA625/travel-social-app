# Free hosting for demos: the backend runs on Render's free plan, the database is a
# Neon free Postgres (Render's own free database expires after 30 days), the web app
# is on Firebase Hosting (mobile/firebase.json) and media is on Cloudinary.
#
# Free Render services sleep after 15 minutes without traffic; the first request
# after that takes about a minute while it starts again.

services:
  - type: web
    name: travel-social-backend
    runtime: node
    plan: free
    region: singapore
    branch: web-dev-deploy-foundation
    rootDir: backend
    # Dev dependencies (prisma CLI, TypeScript) are needed to build.
    buildCommand: npm install --include=dev && npx prisma generate && npx prisma migrate deploy && npm run build
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      # Neon connection string (Dashboard > Connection details), ending in ?sslmode=require
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 30d
      # This service's own URL, e.g. https://travel-social-backend.onrender.com
      - key: PUBLIC_BASE_URL
        sync: false
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      # Optional: Google sign-in and the AI trip assistant.
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      # Password-reset email (Brevo). MAIL_FROM must be a verified sender in Brevo,
      # e.g. "Triply <you@gmail.com>".
      - key: BREVO_API_KEY
        sync: false
      - key: MAIL_FROM
        sync: false
      # The web app that reset links open.
      - key: WEB_APP_URL
        value: https://triply-pi-three.vercel.app

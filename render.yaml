databases:
  - name: travel-social-db
    plan: free
    databaseName: travel_social
    user: travel

services:
  - type: web
    name: travel-social-backend
    runtime: node
    plan: free
    rootDir: backend
    buildCommand: npm install && npx prisma generate && npx prisma migrate deploy && npm run build
    startCommand: npm start
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: travel-social-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 30d
      - key: UPLOADS_DIR
        value: uploads
      - key: PUBLIC_BASE_URL
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false

  - type: web
    name: travel-social-web
    runtime: static
    rootDir: mobile
    buildCommand: npm install && npx expo export -p web
    staticPublishPath: dist

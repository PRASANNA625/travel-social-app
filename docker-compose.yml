services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: travel
      POSTGRES_PASSWORD: travel
      POSTGRES_DB: travel_social
    ports:
      - "5432:5432"
    volumes:
      - travel_social_pgdata:/var/lib/postgresql/data

volumes:
  travel_social_pgdata:
